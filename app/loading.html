<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Space Grotesk', sans-serif;
    font-optical-sizing: auto;
    font-weight: 400;
    font-style: normal;
    overflow: hidden;
    background: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    body {
      background: #171717;
    }
  }

  .container {
    position: relative;
    display: flex;
    height: 100dvh;
    width: 100dvw;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background-color: var(--background);
  }

  .gradient-text {
    pointer-events: none;
    white-space: pre-wrap;
    background: linear-gradient(to bottom, #000000, rgba(107, 114, 128, 0.8));
    -webkit-background-clip: text;
    background-clip: text;
    text-align: center;
    font-size: 6rem;
    font-weight: 600;
    line-height: 1;
    color: transparent;
  }

  @media (prefers-color-scheme: dark) {
    .gradient-text {
      background: linear-gradient(to bottom, #ffffff, rgba(15, 23, 42, 0.1));
      -webkit-background-clip: text;
      background-clip: text;
    }
  }

  #particles {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
  }
</style>
<div class="container">
  <span class="gradient-text">Loading...</span>
  <div id="particles">
    <canvas id="particleCanvas"></canvas>
  </div>
</div>
<script>
  class ParticleCanvas {
    constructor(container, options = {}) {
      this.container = typeof container === 'string' ? document.querySelector(container) : container

      this.options = {
        color: '#FFF',
        quantity: 100,
        staticity: 50,
        ease: 50,
        ...options,
      }

      this.canvas = document.getElementById('particleCanvas')
      this.context = this.canvas.getContext('2d')
      this.circles = []
      this.mouse = { x: 0, y: 0 }
      this.canvasSize = { w: 0, h: 0 }
      this.pixelRatio = window.devicePixelRatio || 1
      this.animationId = null

      this.handleResize = this.handleResize.bind(this)
      this.handleMouseMove = this.handleMouseMove.bind(this)
      this.animate = this.animate.bind(this)

      this.init()
    }

    init() {
      this.setupEventListeners()
      this.initCanvas()
      this.animate()
    }

    setupEventListeners() {
      document.addEventListener('mousemove', this.handleMouseMove)
    }

    handleResize() {
      this.initCanvas()
    }

    handleMouseMove(event) {
      if (this.canvas) {
        const rect = this.canvas.getBoundingClientRect()
        const { w, h } = this.canvasSize
        const x = event.clientX - rect.left - w / 2
        const y = event.clientY - rect.top - h / 2

        const inside = x < w / 2 && x > -w / 2 && y < h / 2 && y > -h / 2
        if (inside) {
          this.mouse.x = x
          this.mouse.y = y
        }
      }
    }

    initCanvas() {
      this.resizeCanvas()
      this.drawParticles()
    }

    resizeCanvas() {
      if (this.canvas && this.context) {
        this.circles.length = 0
        // Use the maximum available size, but fallback to container if smaller
        const maxWidth = Math.max(window.innerWidth, document.documentElement.clientWidth)
        const maxHeight = Math.max(window.innerHeight, document.documentElement.clientHeight)

        this.canvasSize.w = maxWidth
        this.canvasSize.h = maxHeight
        this.canvas.width = this.canvasSize.w * this.pixelRatio
        this.canvas.height = this.canvasSize.h * this.pixelRatio
        this.canvas.style.width = `${this.canvasSize.w}px`
        this.canvas.style.height = `${this.canvasSize.h}px`
        this.context.setTransform(1, 0, 0, 1, 0, 0)
        this.context.scale(this.pixelRatio, this.pixelRatio)
      }
    }

    hexToRgb(hex) {
      hex = hex.replace(/^#/, '')

      if (hex.length === 3)
        hex = hex
          .split('')
          .map((char) => char + char)
          .join('')

      const bigint = Number.parseInt(hex, 16)
      const r = (bigint >> 16) & 255
      const g = (bigint >> 8) & 255
      const b = bigint & 255

      return `${r} ${g} ${b}`
    }

    circleParams() {
      const x = Math.floor(Math.random() * this.canvasSize.w)
      const y = Math.floor(Math.random() * this.canvasSize.h)
      const translateX = 0
      const translateY = 0
      const size = Math.floor(Math.random() * 2) + 1
      const alpha = 0
      const targetAlpha = Number.parseFloat((Math.random() * 0.6 + 0.1).toFixed(1))
      const dx = (Math.random() - 0.5) * 0.2
      const dy = (Math.random() - 0.5) * 0.2
      const magnetism = 0.1 + Math.random() * 4

      return {
        x,
        y,
        translateX,
        translateY,
        size,
        alpha,
        targetAlpha,
        dx,
        dy,
        magnetism,
      }
    }

    drawCircle(circle, update = false) {
      if (this.context) {
        const { x, y, translateX, translateY, size, alpha } = circle
        this.context.translate(translateX, translateY)
        this.context.beginPath()
        this.context.arc(x, y, size, 0, 2 * Math.PI)
        const rgbColor = this.hexToRgb(this.options.color)
        this.context.fillStyle = `rgba(${rgbColor.split(' ').join(', ')}, ${alpha})`
        this.context.fill()
        this.context.setTransform(this.pixelRatio, 0, 0, this.pixelRatio, 0, 0)

        if (!update) this.circles.push(circle)
      }
    }

    clearContext() {
      if (this.context) this.context.clearRect(0, 0, this.canvasSize.w, this.canvasSize.h)
    }

    drawParticles() {
      this.clearContext()
      const particleCount = this.options.quantity
      for (let i = 0; i < particleCount; i++) {
        const circle = this.circleParams()
        this.drawCircle(circle)
      }
    }

    remapValue(value, start1, end1, start2, end2) {
      const remapped = ((value - start1) * (end2 - start2)) / (end1 - start1) + start2
      return remapped > 0 ? remapped : 0
    }

    animate() {
      this.clearContext()

      this.circles.forEach((circle, i) => {
        // Handle the alpha value
        const edge = [
          circle.x + circle.translateX - circle.size,
          this.canvasSize.w - circle.x - circle.translateX - circle.size,
          circle.y + circle.translateY - circle.size,
          this.canvasSize.h - circle.y - circle.translateY - circle.size,
        ]

        const closestEdge = edge.reduce((a, b) => Math.min(a, b))
        const remapClosestEdge = Number.parseFloat(this.remapValue(closestEdge, 0, 20, 0, 1).toFixed(2))

        if (remapClosestEdge > 1) {
          circle.alpha += 0.02
          if (circle.alpha > circle.targetAlpha) circle.alpha = circle.targetAlpha
        } else circle.alpha = circle.targetAlpha * remapClosestEdge

        circle.x += circle.dx
        circle.y += circle.dy
        circle.translateX +=
          (this.mouse.x / (this.options.staticity / circle.magnetism) - circle.translateX) / this.options.ease
        circle.translateY +=
          (this.mouse.y / (this.options.staticity / circle.magnetism) - circle.translateY) / this.options.ease

        if (
          circle.x < -circle.size ||
          circle.x > this.canvasSize.w + circle.size ||
          circle.y < -circle.size ||
          circle.y > this.canvasSize.h + circle.size
        ) {
          this.circles.splice(i, 1)
          const newCircle = this.circleParams()
          this.drawCircle(newCircle)
        } else {
          this.drawCircle(
            {
              ...circle,
              x: circle.x,
              y: circle.y,
              translateX: circle.translateX,
              translateY: circle.translateY,
              alpha: circle.alpha,
            },
            true,
          )
        }
      })

      this.animationId = requestAnimationFrame(this.animate)
    }

    destroy() {
      document.removeEventListener('mousemove', this.handleMouseMove)

      if (this.animationId) cancelAnimationFrame(this.animationId)

      if (this.canvas && this.canvas.parentNode) this.canvas.parentNode.removeChild(this.canvas)
    }

    updateOptions(newOptions) {
      this.options = { ...this.options, ...newOptions }
      this.drawParticles()
    }
  }

  const particles = new ParticleCanvas('#particles', {
    color: '#ffffff',
    quantity: 100,
    staticity: 50,
    ease: 50,
  })

  function updateModeIndicator() {
    const modeIndicator = document.getElementById('modeIndicator')
    const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
    modeIndicator.textContent = isDark ? 'Dark Mode' : 'Light Mode'
  }

  window.addEventListener('beforeunload', () => {
    particles.destroy()
  })
</script>
